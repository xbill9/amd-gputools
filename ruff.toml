# Pinned rule set for amd-gputools.
#
# Pinned, not left to ruff's implicit defaults, because those defaults drift
# across releases and the drift is not hypothetical: with no config in this
# tree, ruff 0.16.7 selected UP and BLE on top of the intended rules and failed
# server.py with 18 findings on 2026-09-16. Two of those rules are wrong for
# this codebase on purpose:
#
#   UP045  wants `str | None` and flags the `Optional[str]` style the sibling
#          gemma4-dev servers use. Match the surrounding code, not the release.
#   BLE001 flags the blind `except Exception` that every MCP tool ends with.
#          That is the design: a tool returns an "❌ ..." string to the client
#          instead of raising, because an exception escaping a tool kills the
#          server process for every later call.

target-version = "py313"
line-length = 120

extend-exclude = [".claude/skills", "dist"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ISC"]
ignore = ["E501"]  # Line length is enforced by the formatter, not the linter.

[format]
quote-style = "double"
